name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    environment:
      name: production
 steps:
  - uses: actions/checkout@v4

  - run: echo "Waiting for approval..."

  - uses: ./.github/actions/docker-build-push
    with:
      image_name: my-app
     
